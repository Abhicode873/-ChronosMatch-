[build-system]
requires = ["setuptools>=75", "wheel", "Cython>=3.3,<3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "chronosmatch"
version = "0.1.0"
description = "An experimental low-latency trading system simulator."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"
